model_family: TEMPORAL
raw_factor_count_min: 15
raw_factor_count_max: 60
history_length: 20
minimum_valid_history_length: 15
gru:
  hidden_dim: 128
  num_layers: 1
  dropout: 0.1
tcn:
  hidden_dim: 128
  kernel_size: 3
  dilations: [1, 2, 4]
  dropout: 0.1
search_space:
  family: [GRU, TCN]
  hidden_dim: [64, 128]
  dropout: [0.0, 0.1, 0.2]
  learning_rate: [0.0003, 0.001]
